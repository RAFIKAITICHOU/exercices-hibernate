# Connexion MAMP (port MySQL 8889, root / root). Adapter si besoin.
hibernate.connection.driver_class=com.mysql.cj.jdbc.Driver
hibernate.connection.url=jdbc:mysql://localhost:8889/gestion_stock?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
hibernate.connection.username=root
hibernate.connection.password=root
hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# create = les tables sont recréées à chaque exécution (données de test propres)
hibernate.hbm2ddl.auto=create
hibernate.show_sql=false
hibernate.format_sql=true
